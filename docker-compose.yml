services:
  db:
    image: postgres:16
    container_name: pengutype-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pengutype
    ports:
      - "5432:5432"
    volumes:
      - pengutype_pgdata:/var/lib/postgresql/data

volumes:
  pengutype_pgdata:
